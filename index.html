<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GURI STRIPE — a bicicleta que era o mundo inteiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#0e0d12;
    --deep:#161320;
    --amarelo:#ffd23f;
    --vermelho:#ff4d4d;
    --azul:#4d7cff;
    --creme:#f2ede0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--asphalt);
    color:var(--creme);
    font-family:'Space Mono', monospace;
    overflow-x:hidden;
    cursor:none;
  }
  ::selection{ background:var(--vermelho); color:#000; }

  #cursor{
    position:fixed; top:0; left:0;
    width:22px; height:22px;
    border:1px solid var(--amarelo);
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:width .2s, height .2s, border-color .2s;
    mix-blend-mode:screen;
  }

  #trilha{ position:fixed; inset:0; z-index:0; }
  #grain{
    position:fixed; inset:0; z-index:1;
    pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  }

  .veil{ position:relative; z-index:3; }

  section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10vh 6vw;
    position:relative;
  }

  .roman{
    font-family:'Cormorant Garamond', serif;
    font-weight:300; font-style:italic;
    color:var(--amarelo);
    letter-spacing:.4em;
    font-size:.75rem;
    text-transform:uppercase;
    margin-bottom:3rem;
    opacity:0;
    animation:rise 1.6s ease forwards;
  }

  h1.epoch{
    font-family:'Cormorant Garamond', serif;
    font-weight:300;
    font-size:clamp(3rem, 10vw, 8.5rem);
    line-height:.95;
    opacity:0;
    animation:rise 1.8s .3s ease forwards;
  }
  h1.epoch em{
    font-style:italic;
    background:linear-gradient(120deg, var(--amarelo), var(--vermelho) 55%, var(--azul));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.scripture{
    max-width:44ch;
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(1.1rem,2vw,1.5rem);
    font-style:italic;
    color:#cfc8b8;
    line-height:1.8;
    margin-top:2.5rem;
    opacity:0;
    animation:rise 1.8s .6s ease forwards;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(28px);}
    to{opacity:1; transform:translateY(0);}
  }

  .scrollcue{
    position:absolute; bottom:6vh;
    display:flex; flex-direction:column; align-items:center; gap:.8rem;
    color:#cfc8b8; font-size:.65rem; letter-spacing:.3em; opacity:.6;
  }
  .scrollcue .stem{
    width:1px; height:50px;
    background:linear-gradient(var(--amarelo), transparent);
    animation:stretch 2s ease-in-out infinite;
  }
  @keyframes stretch{
    0%,100%{transform:scaleY(1); opacity:.4;}
    50%{transform:scaleY(1.3); opacity:1;}
  }

  .epochs-nav{
    position:fixed; right:3vw; top:50%; transform:translateY(-50%);
    z-index:10; display:flex; flex-direction:column; gap:1.4rem;
  }
  .epochs-nav a{
    width:8px; height:8px; border-radius:50%;
    background:transparent; border:1px solid #cfc8b8;
    display:block; transition:.3s;
  }
  .epochs-nav a.active{ background:var(--amarelo); border-color:var(--amarelo); box-shadow:0 0 14px var(--amarelo); }

  .relic{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    max-width:900px; width:100%;
    margin-top:5rem;
  }
  .relic div{ background:var(--asphalt); padding:2.2rem 1.4rem; }
  .relic .n{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:2.4rem; color:var(--amarelo); }
  .relic .l{ font-size:.6rem; letter-spacing:.2em; color:#cfc8b8; margin-top:.6rem; text-transform:uppercase; }

  /* Bicicleta SVG assinatura */
  .bike-wrap{
    margin-top:4rem;
    width:min(90vw, 560px);
    opacity:0;
    animation:rise 1.8s .9s ease forwards;
  }
  .bike-wrap svg{ width:100%; height:auto; overflow:visible; }
  .stripe-a{ stroke:var(--amarelo); }
  .stripe-b{ stroke:var(--vermelho); }
  .stripe
