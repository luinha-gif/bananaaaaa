<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUPI Strip</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    color:#222;
    padding:2rem;
  }
  .card {
    max-width:600px;
    margin:0 auto;
    background:#fff;
    border-radius:8px;
    padding:2rem;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  h1 {
    font-size:1.8rem;
    margin-bottom:.3rem;
  }
  .tag {
    color:#777;
    font-size:.9rem;
    margin-bottom:1.5rem;
  }
  table {
    width:100%;
    border-collapse:collapse;
  }
  td {
    padding:.6rem 0;
    border-bottom:1px solid #eee;
    font-size:.95rem;
  }
  td:first-child {
    color:#555;
    width:40%;
  }
  td:last-child {
    font-weight:bold;
  }
</style>
</head>
<body>

<div class="card">
  <h1>HUPI Strip</h1>
  <div class="tag">Quadro para uso urbano e manobras (street/freestyle)</div>

  <table>
    <tr><td>Material do quadro</td><td>Alumínio 6061 T6</td></tr>
    <tr><td>Gancheira</td><td>Horizontal</td></tr>
    <tr><td>Aro</td><td>26</td></tr>
    <tr><td>Caixa de direção</td><td>Tapered</td></tr>
    <tr><td>Transmissão</td><td>Single speed</td></tr>
    <tr><td>Estilo</td><td>Urbano / Street / Wheeling</td></tr>
  </table>
</div>

</body>
</html>
